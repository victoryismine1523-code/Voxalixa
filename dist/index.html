    <!--
      CRITICAL: the Google Fonts stylesheet is loaded NON-BLOCKING.
      A pending stylesheet blocks execution of every script after it, so a slow
      fonts.googleapis.com would stall the entire React app. `media="print"`
      keeps it out of the critical path; onload flips it to `all`. The inline
      <style> below sets a system-font fallback so text paints immediately and
      swaps in Montserrat when it arrives (display=swap).
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" />
    </noscript>

    <!-- Inline brand color + system-font fallback so first paint is never white or invisible -->
    <style>
      html, body { background: #0B0B0F; color: #F8F8FF; margin: 0; }
      /* FOIT guard: render immediately in a system stack, swap to Montserrat on load */
      body {
        font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI",
                     Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .fonts-loaded body { font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    </style>
    <script>
      // Flag when Montserrat is actually available (used for progressive swap)
      if (document.fonts && document.fonts.load) {
        document.fonts.load('700 1rem Montserrat').then(function () {
          document.documentElement.classList.add('fonts-loaded')
        }).catch(function () {})
      } else {
        document.documentElement.classList.add('fonts-loaded')
      }
    </script>
